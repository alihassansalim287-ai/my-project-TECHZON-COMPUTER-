<!DOCTYPE html> <!-- تعريف نوع المستند كـ HTML5 -->
<html lang="ar" dir="rtl"> <!-- تحديد اللغة كالعربية والاتجاه من اليمين لليسار -->
<head> <!-- بداية رأس الصفحة -->
    <meta charset="UTF-8"> <!-- تحديد ترميز الحروف لدعم اللغة العربية -->
    <title>تأكيد الشراء</title> <!-- عنوان الصفحة -->

    <style> /* بداية أكواد التصميم (CSS) */
        body {
            background-image: url(IMAGES/1789332439106.png); /* لون خلفية أبيض بسيط */
            font-family: Arial, sans-serif; /* نوع خط بسيط ومقروء */
        }
        .box {
            border: 2px solid green; /* إطار أخضر بسيط حول الصندوق */
            padding: 20px; /* مسافة داخلية */
            background-image: url(IMAGES/1789335008020.png);
            width: 300px; /* عرض ثابت للصندوق */
            margin-top: 50px; /* مسافة من أعلى الصفحة */
        }
        h1 {
            color: green; /* لون العنوان أخضر ليدل على النجاح */
        }
        img {
            width: 250px; /* عرض مناسب للصورة */
            height: 200px; /* ارتفاع ثابت للصورة */
        }
        a {
            background-color: blue; /* لون خلفية الزر أزرق */
            color: white; /* لون النص أبيض */
            padding: 10px 20px; /* مسافة داخلية للزر */
            text-decoration: none; /* إزالة الخط الموجود تحت الرابط */
            display: inline-block; /* جعل الرابط يتصرف كعنصر كتلة لضبط الأبعاد */
            margin-top: 15px; /* مسافة فوق الزر */
        }
    </style> <!-- نهاية أكواد التصميم -->
</head>
<body> <!-- بداية جسم الصفحة (المحتوى المرئي) -->

<center> <!-- توسيط جميع العناصر في الصفحة بشكل بسيط -->
    <div class="box"> <!-- صندوق لجمع محتويات صفحة النجاح -->
        <h1>تم الشراء بنجاح!</h1> <!-- رسالة تأكيد الشراء -->
        <img src="IMAGES\تنزيل.jfif" alt="صورة المنتج"> <!-- صورة المنتج الذي تم شراؤه -->
        <h2>لابتوب Dell Xps 15 </h2> <!-- اسم المنتج -->
        <p>شكراً لطلبك.</p> <!-- رسالة شكر بسيطة -->
        <a href="index.html">الرجوع للقائمة</a> <!-- رابط للعودة للصفحة الرئيسية -->
    </div> <!-- نهاية الصندوق -->
</center> <!-- نهاية وسم التوسيط -->

</body> <!-- نهاية جسم الصفحة -->
</html> <!-- نهاية ملف الـ HTML -->
